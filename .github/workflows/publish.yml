name: Publish

# Publishes @sasjs/sas-language to npm. Versioning is semantic-release's job: it
# reads the conventional commits on main, bumps the version, tags the release and
# writes the GitHub release. Publishing is a separate step, because it uses the
# npm trusted publisher rather than a token.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes the version commit and the tag
      id-token: write # npm provenance, through the trusted publisher
      issues: write # lets @semantic-release/github comment on issues
      pull-requests: write # lets @semantic-release/github comment on pull requests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and the tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x, and the trusted publisher needs npm >= 11.5.1.
      # The major is pinned rather than tracking @latest, so a release does not
      # adopt a new npm major on its own: npm 12 parses `npm run <script> --flag`
      # differently, and a release is the worst place to find that out. The
      # upstream build works on both majors, so this is a hedge rather than a
      # requirement - see patchSubBuildDispatch in scripts/build-server.mjs.
      - name: Update npm
        run: npm install -g npm@^11

      - name: Install dependencies
        # --ignore-scripts: no install script from any dependency runs. The
        # gitleaks binary below is a plain devDependency binary and needs no
        # postinstall.
        run: npm ci --ignore-scripts

      # A release is the worst place to discover a leaked credential or a new
      # advisory, so the same gates CI applies are applied here.
      - name: Scan for secrets (gitleaks)
        run: node_modules/.bin/gitleaks detect --source . --redact --no-banner -v

      - name: Audit dependencies
        # Every dependency, dev included. The package has no runtime
        # dependencies, and the release tooling is not installed here, so any
        # advisory at all is a real one.
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Publishing data that does not match the repository would be worse than
      # publishing nothing, so the refresh is replayed and the result compared
      # before any of this reaches npm.
      - name: Data is in sync with its provenance
        run: |
          npm run fetch -- --ref "$(node -p "require('./provenance.json').upstreamRef")"
          npm run build
          if [ -n "$(git status --porcelain data provenance.json src/groups.generated.ts)" ]; then
            echo "data/, provenance.json or src/groups.generated.ts differ from a fresh build:"
            git --no-pager diff --stat data provenance.json src/groups.generated.ts
            echo "Run 'npm run refresh && npm run build' and commit the result."
            exit 1
          fi

      - name: Audit the release toolchain
        # Its own scope: the toolchain is not shipped, so it must not gate the
        # package, but it runs with publish credentials, so it must not be
        # invisible either. Fails on anything outside the named exemptions in
        # release/audit.mjs.
        run: node release/audit.mjs

      - name: Install the release tooling
        # Its own locked tree, installed here rather than carried as a
        # devDependency: that tree is where the unfixable advisories live, so
        # keeping it out of the package's dependencies keeps it out of the
        # package's `npm audit`. Locked, so the resolved versions and their
        # integrity hashes are pinned rather than fetched fresh at release time.
        run: npm ci --prefix release --ignore-scripts

      - name: Semantic release
        run: release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release only releases when the commits since the last tag call
      # for one, so on every other push to main the version is already published.
      # Checking the registry first keeps those runs green instead of failing
      # with E403, which is what an unconditional publish would do.
      - name: Publish to npm with the trusted publisher
        run: |
          version=$(node -p "require('./package.json').version")

          if npm view "@sasjs/sas-language@${version}" version > /dev/null 2>&1; then
            echo "@sasjs/sas-language@${version} is already published; nothing to do"
            exit 0
          fi

          # Neither dist/ nor server/ is committed, and .npmrc sets
          # ignore-scripts=true so the prepack build does not run here. Build
          # both explicitly rather than relying on an earlier step happening to
          # leave them on disk.
          npm run build
          npm run build:server

          # A tarball missing either half of the package is worse than no
          # release at all, so every artifact is checked before anything reaches
          # npm.
          for required in dist/index.js server/browser/server.js server/node/dist/node/server.js server/node/pubsdata server/node/messagebundle.properties; do
            if [ ! -s "$required" ]; then
              echo "$required is missing - refusing to publish an incomplete package"
              exit 1
            fi
          done

          echo "publishing @sasjs/sas-language@${version}"
          npm publish --access public
