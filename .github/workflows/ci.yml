name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Fetch the pinned upstream data
        run: npm run fetch -- --ref "$(node -p "require('./provenance.json').upstreamRef")"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The committed data and build output must be exactly what the committed
      # provenance and a fresh build produce, so a hand edit, a stale
      # .upstream/, or a dist/ that no longer matches its source cannot pass.
      # dist/ is committed because a consumer with ignore-scripts=true cannot
      # build it on install.
      - name: Data and build output are in sync
        run: |
          if [ -n "$(git status --porcelain data dist provenance.json src/groups.generated.ts)" ]; then
            echo "data/, dist/, provenance.json or src/groups.generated.ts differ from a fresh build:"
            git --no-pager diff --stat data dist provenance.json src/groups.generated.ts
            echo "Run 'npm run refresh && npm run build' and commit the result."
            exit 1
          fi
