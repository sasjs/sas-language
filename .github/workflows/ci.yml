name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --ignore-scripts: no install script from any dependency runs. The
        # gitleaks binary below is a plain devDependency binary and needs no
        # postinstall.
        run: npm ci --ignore-scripts

      - name: Scan for secrets (gitleaks)
        # The local pre-commit hook is best-effort, and is suppressed entirely
        # where .npmrc sets ignore-scripts=true, so CI is the enforcement point:
        # a leaked credential must fail the build, not just a commit. Same
        # @nogoo9/gitleaks binary the hook pins - gitleaks-action needs a
        # licence key for organisation repos.
        run: node_modules/.bin/gitleaks detect --source . --redact --no-banner -v

      - name: Audit the shipped dependencies
        # Nothing here ships to a consumer, so this must always be clean.
        run: npm audit --omit=dev --audit-level=low

      - name: Audit every dependency, dev included
        # Fails on any advisory outside the documented exemptions, which
        # live inside the npm package that @semantic-release/npm bundles and
        # cannot be reached from here. See scripts/audit.mjs.
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Fetch the pinned upstream data
        run: npm run fetch -- --ref "$(node -p "require('./provenance.json').upstreamRef")"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The committed data must be exactly what the committed provenance and a
      # fresh build produce, so a hand edit or a stale .upstream/ cannot pass.
      - name: Data is in sync with its provenance
        run: |
          if [ -n "$(git status --porcelain data provenance.json src/groups.generated.ts)" ]; then
            echo "data/, provenance.json or src/groups.generated.ts differ from a fresh build:"
            git --no-pager diff --stat data provenance.json src/groups.generated.ts
            echo "Run 'npm run refresh && npm run build' and commit the result."
            exit 1
          fi

  # The language server is compiled from upstream source, which makes it the one
  # slow step in the package. It runs only when its inputs differ from the base,
  # so a data-only pull request stays fast, while a change to the build or the
  # pin is verified before it can reach a release.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the server inputs change?
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(scripts/build-server\.mjs|provenance\.json)$'; then
              echo "needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "server inputs unchanged - skipping the upstream build"
            fi
          else
            # On main this is the post-merge check, and there is no cheap base to
            # diff against, so it always runs.
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.needed == 'true'
        with:
          node-version: 22

      # The same npm the publish workflow installs, so a toolchain difference
      # cannot make this job pass while a release fails. npm 12 parses
      # `npm run <script> --flag` differently from npm 11, and a release that ran
      # on the newer npm failed while this job, on node 22's bundled npm 10,
      # stayed green.
      - name: Update npm
        if: steps.scope.outputs.needed == 'true'
        run: npm install -g npm@^11

      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: npm ci --ignore-scripts

      - name: Build the language server from the pinned commit
        if: steps.scope.outputs.needed == 'true'
        run: npm run build:server

      # Building the wrong commit would be silent otherwise: the script reads the
      # pin, so this asserts that what it produced came from what we publish.
      - name: The staged server matches the pin
        if: steps.scope.outputs.needed == 'true'
        run: |
          node -e '
            const built = require("./server/provenance.json")
            const pinned = require("./provenance.json").upstreamRef
            if (built.upstreamRef !== pinned) {
              console.error("server built from " + built.upstreamRef)
              console.error("but provenance.json pins " + pinned)
              process.exit(1)
            }
            console.log("server built from the pinned commit " + pinned.slice(0, 10))
          '

          for required in server/browser/server.js server/node/dist/node/server.js server/node/dist/node/package.json server/node/pubsdata server/LICENSE.txt; do
            [ -s "$required" ] || { echo "$required is missing or empty"; exit 1; }
          done
